<div class="card">
    <p-toast></p-toast>

    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <div class="flex gap-2">
                <p-button
                        *ngIf="authService.hasRole('ADMIN')"
                        label="Nouveau collaborateur"
                        icon="pi pi-plus"
                        styleClass="p-button-success"
                        (onClick)="openNew()"
                ></p-button>
                <p-button
                        label="Exporter"
                        icon="pi pi-file-excel"
                        styleClass="p-button-help"
                        (onClick)="exportExcel()"
                ></p-button>
            </div>
        </ng-template>

        <ng-template pTemplate="right">
            <div class="flex gap-2">
                <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input
                            pInputText
                            type="text"
                            (input)="onSearch($event)"
                            [(ngModel)]="searchText"
                            placeholder="Rechercher..."
                            class="p-inputtext-sm"
                    />
                </span>
                <p-button
                        icon="pi pi-refresh"
                        (onClick)="clearFilters()"
                        styleClass="p-button-outlined p-button-sm"
                        pTooltip="Actualiser"
                        tooltipPosition="top"
                ></p-button>
            </div>
        </ng-template>
    </p-toolbar>

    <p-table
        #dt
        [value]="collaborateurs"
        [loading]="loading"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]"
        styleClass="p-datatable-sm p-datatable-striped"
        dataKey="id"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} entrées"
        [globalFilterFields]="['nom', 'prenoms', 'matricule', 'email', 'posteActuel']"
    >
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 3rem"></th>
                <th pSortableColumn="matricule">Matricule <p-sortIcon field="matricule"></p-sortIcon></th>
                <th pSortableColumn="nom">Nom & Prénoms <p-sortIcon field="nom"></p-sortIcon></th>
<!--
                <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
-->
                <th pSortableColumn="posteActuel">Poste <p-sortIcon field="posteActuel"></p-sortIcon></th>
             <!--   <th>Affectation</th>-->
                <th pSortableColumn="role">Rôle <p-sortIcon field="role"></p-sortIcon></th>
                <th pSortableColumn="actif">Statut <p-sortIcon field="actif"></p-sortIcon></th>
                <th style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-collab>
            <tr>
                <td>
                    <p-avatar
                            [label]="(collab.nom?.charAt(0) || '') + (collab.prenoms?.charAt(0) || '')"
                            size="normal"
                            shape="circle"
                            [style]="{ 'background-color': getAvatarColor(collab.role), 'color': '#ffffff' }"
                    ></p-avatar>
                </td>
                <td><span class="font-medium">{{collab.matricule}}</span></td>
                <td>{{collab.prenoms}} {{collab.nom}}</td>
              <!--  <td>{{collab.email}}</td>-->
                <td>{{collab.posteActuel || '-'}}</td>
                <!--<td>
                    <div class="flex flex-column">
                        <small *ngIf="collab.directionNom" class="text-primary font-medium">{{collab.directionNom}}</small>
                        <small *ngIf="collab.serviceNom" class="text-secondary">{{collab.serviceNom}}</small>
                        <small *ngIf="collab.sectionNom" class="text-500">{{collab.sectionNom}}</small>
                    </div>
                </td>-->
                <td>
                    <!-- ✅ Correction: Utiliser roleLabels au lieu de RoleLabels -->
                    <p-tag
                            [value]="roleLabels[collab.role] || collab.role"
                            [severity]="getRoleSeverity(collab.role)"
                    ></p-tag>
                </td>
                <td>
                    <p-tag
                            [value]="collab.actif ? 'Actif' : 'Inactif'"
                            [severity]="collab.actif ? 'success' : 'danger'"
                    ></p-tag>
                </td>
                <td>
                    <div class="flex gap-1">
                        <p-button
                                icon="pi pi-eye"
                                (onClick)="viewCollaborateur(collab.id!)"
                                pTooltip="Voir détails"
                                tooltipPosition="top"
                                styleClass="p-button-rounded p-button-text p-button-info"
                        ></p-button>

                        <p-button
                                *ngIf="authService.hasAnyRole(['ADMIN', 'DIRECTEUR'])"
                                icon="pi pi-pencil"
                                (onClick)="editCollaborateur(collab.id!)"
                                pTooltip="Modifier"
                                tooltipPosition="top"
                                styleClass="p-button-rounded p-button-text p-button-warning"
                        ></p-button>

                        <p-button
                                *ngIf="authService.hasRole('ADMIN')"
                                icon="pi pi-trash"
                                (onClick)="confirmDelete(collab)"
                                pTooltip="Supprimer"
                                tooltipPosition="top"
                                styleClass="p-button-rounded p-button-text p-button-danger"
                        ></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="9" class="text-center p-4">
                    <i class="pi pi-users" style="font-size: 3rem; color: #ccc"></i>
                    <h4 class="text-gray-500 mt-3">Aucun collaborateur trouvé</h4>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmDialog></p-confirmDialog>
