<div class="grid align-items-center justify-content-center h-screen">
    <div class="col-12 md:col-8">
        <p-card header="Connexion" class="shadow-3 border-round-xl">

<div class="p-grid p-fluid">
    <div class="p-col-12">
        <div class="card">
            <h5>Création d'Utilisateur</h5>

            <div class="p-fluid grid">
                <!-- Champs de base -->
                <div class="field col-12 md:col-6">
                    <label for="username">Username *</label>
                    <input id="username" type="text" pInputText [(ngModel)]="registerDTO.username" required>
                </div>

                <div class="field col-12 md:col-6">
                    <label for="prenom">Prénom *</label>
                    <input id="prenom" type="text" pInputText [(ngModel)]="registerDTO.prenom" required>
                </div>

                <div class="field col-12 md:col-6">
                    <label for="nom">Nom *</label>
                    <input id="nom" type="text" pInputText [(ngModel)]="registerDTO.nom" required>
                </div>

                <div class="field col-12 md:col-6">
                    <label for="role">Rôle *</label>
                    <p-dropdown [options]="roles" [(ngModel)]="registerDTO.role"
                                optionLabel="label" optionValue="value"
                                placeholder="Sélectionnez un rôle"
                                (onChange)="onRoleChange()" required>
                    </p-dropdown>
                </div>

                <div class="field col-12 md:col-6">
                    <label for="password">Mot de passe *</label>
                    <input id="password" type="password" pInputText [(ngModel)]="registerDTO.password" required>
                </div>

                <div class="field col-12 md:col-6">
                    <label for="confirmPassword">Confirmer le mot de passe *</label>
                    <input id="confirmPassword" type="password" pInputText [(ngModel)]="registerDTO.confirmPassword" required>
                </div>

                <!-- Direction (toujours visible si rôle sélectionné) -->
                <div class="field col-12 md:col-6" *ngIf="registerDTO.role">
                    <label for="direction">Direction *</label>
                    <p-dropdown [options]="directions" [(ngModel)]="registerDTO.directionId"
                                optionLabel="libelle" optionValue="id"
                                placeholder="Sélectionnez une direction"
                                (onChange)="onDirectionChange()" required>
                    </p-dropdown>
                </div>

                <!-- Service (visible pour CHEF_SERVICE, CHEF_SECTION, AGENT) -->
                <div class="field col-12 md:col-6"
                     *ngIf="registerDTO.role && ['CHEF_SERVICE', 'CHEF_SECTION', 'AGENT'].includes(registerDTO.role) && registerDTO.directionId">
                    <label for="service">Service *</label>
                    <p-dropdown [options]="services" [(ngModel)]="registerDTO.serviceId"
                                optionLabel="libelle" optionValue="id"
                                placeholder="Sélectionnez un service"
                                (onChange)="onServiceChange()" required>
                    </p-dropdown>
                </div>

                <!-- Section (visible pour CHEF_SECTION, AGENT) -->
                <div class="field col-12 md:col-6"
                     *ngIf="registerDTO.role && ['CHEF_SECTION', 'AGENT'].includes(registerDTO.role) && registerDTO.serviceId">
                    <label for="section">Section *</label>
                    <p-dropdown [options]="sections" [(ngModel)]="registerDTO.sectionId"
                                optionLabel="libelle" optionValue="id"
                                placeholder="Sélectionnez une section"
                                (onChange)="onSectionChange()" required>
                    </p-dropdown>
                </div>

                <!-- Agent (visible seulement pour AGENT) -->
                <div class="field col-12 md:col-6"
                     *ngIf="registerDTO.role === 'AGENT' && registerDTO.sectionId">
                    <label for="agent">Agent *</label>
                    <p-dropdown [options]="agents" [(ngModel)]="registerDTO.agentId"
                                optionLabel="nomComplet" optionValue="id"
                                placeholder="Sélectionnez un agent" required>
                    </p-dropdown>
                </div>

                <div class="field col-12">
                    <button pButton type="button" label="Créer l'utilisateur"
                            icon="pi pi-user-plus" class="p-button-success"
                            (click)="register()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
        </p-card>
    </div>
</div>

<p-toast></p-toast>
